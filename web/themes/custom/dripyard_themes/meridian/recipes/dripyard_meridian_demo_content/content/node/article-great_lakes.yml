  body:
    -
      value: '<p>The Great Lakes hold twenty percent of the world''s surface fresh water — a resource of global significance. The watersheds that feed these inland seas support forests, wetlands, and prairies that are home to hundreds of species found nowhere else. Meridian''s Great Lakes programs work to protect the land and water connections that keep this system healthy.</p><drupal-media data-entity-type="media" data-entity-uuid="a6efa458-ec21-4781-a5e2-67b7a423f08a" data-align="left" data-caption="Great Lakes coastal wetland">&nbsp;</drupal-media><p>Our focus areas include protecting coastal wetlands that filter runoff and provide critical fish spawning habitat, restoring degraded tributaries that connect inland forests to the lakes, and monitoring invasive species that threaten native ecosystems. We work with landowners along key tributaries to implement best management practices that reduce erosion and nutrient loading.</p><p>The Great Lakes region faces compounding pressures from agricultural runoff, urban development, and climate change. Warmer water temperatures, shifting precipitation patterns, and more frequent extreme storms are altering lake ecology in ways we are only beginning to understand. Our research and monitoring programs help track these changes and inform adaptive conservation strategies for the decades ahead.</p>'
