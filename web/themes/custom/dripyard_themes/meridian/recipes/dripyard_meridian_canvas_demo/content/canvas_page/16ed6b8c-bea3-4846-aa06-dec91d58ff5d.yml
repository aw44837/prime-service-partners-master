      component_id: sdc.dripyard_base.text
      inputs:
        text:
          value: '<p>North American prairies once covered 170 million acres but have declined by over 99%. Our grassland restoration projects work with ranchers to implement rotational grazing practices that benefit both livestock and native species like bison, prairie dogs, and grassland birds.</p>'
