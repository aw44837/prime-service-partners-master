        variation: borders
    -
      parent_uuid: 1b056252-3a43-44c4-a430-9e76639ff962
      slot: accordion_group_content
      uuid: be7ec238-4e54-46a9-8762-e5e42a5a83ca
      component_id: sdc.dripyard_base.accordion-item
      inputs:
        title: 'Wetland Restoration'
        open: false
    -
      parent_uuid: be7ec238-4e54-46a9-8762-e5e42a5a83ca
      slot: accordion_item_content
      uuid: 7224102b-9996-4b6f-a6b4-e911e8bece2b
      component_id: sdc.dripyard_base.text
      inputs:
        text:
          value: "<p>Our coastal wetlands serve as critical nurseries for marine life and act as natural buffers against storm surges. We're working to restore over 5,000 acres of salt marshes and estuaries along the Atlantic coastline, protecting both wildlife and coastal communities from rising sea levels.</p>"
          format: canvas_html_block
        style: body_m
        color: medium
        center: false
    -
      parent_uuid: 1b056252-3a43-44c4-a430-9e76639ff962
      slot: accordion_group_content
      uuid: 74806fad-4817-4c41-926f-c1dbb1a33e3d
      component_id: sdc.dripyard_base.accordion-item
      inputs:
        title: 'Marine Sanctuaries'
        open: false
    -
      parent_uuid: 74806fad-4817-4c41-926f-c1dbb1a33e3d
      slot: accordion_item_content
      uuid: d15e59e7-3192-4b10-a64e-9dc71d638a75
      component_id: sdc.dripyard_base.text
      inputs:
        text:
          value: '<p>We partner with federal and state agencies to establish and maintain marine protected areas that safeguard critical ocean habitats. These sanctuaries provide refuge for endangered sea turtles, migrating whales, and countless fish species while supporting sustainable fishing communities.</p>'
          format: canvas_html_block
        style: body_m
        color: medium
        center: false
    -
      parent_uuid: 1b056252-3a43-44c4-a430-9e76639ff962
      slot: accordion_group_content
      uuid: 1920be4c-bda0-42a5-b960-aa99b1af9a19
      component_id: sdc.dripyard_base.accordion-item
      inputs:
        title: 'Dune Restoration'
        open: false
    -
      parent_uuid: 1920be4c-bda0-42a5-b960-aa99b1af9a19
      slot: accordion_item_content
      uuid: 9cdc42ed-fa47-4eff-bdf1-158bae7f820c
      component_id: sdc.dripyard_base.text
      inputs:
        text:
          value: "<p>Coastal dunes are nature's first line of defense against erosion and flooding. Our restoration projects replant native sea oats and beach grasses while removing invasive species, rebuilding these vital barriers that protect inland communities and provide essential nesting habitat for shorebirds.</p>"
          format: canvas_html_block
        style: body_m
        color: medium
        center: false
