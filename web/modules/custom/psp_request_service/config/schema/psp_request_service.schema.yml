psp_request_service.settings:
  type: config_object
  label: 'Request Service form settings'
  mapping:
    company_name:
      type: string
      label: 'Company name used in SMS consent and the booking email'
    lead_source:
      type: string
      label: 'Lead source value'
    email_subject:
      type: string
      label: 'Booking email subject (empty = "New <company> Booking Request")'
    zips:
      type: sequence
      label: 'Service-area zip codes (empty = accept any 5-digit zip)'
      sequence:
        type: string
        label: 'Zip code'

block.settings.psp_booking_card:
  type: block_settings
  label: 'Booking card block'
  constraints:
    FullyValidatable: ~
  mapping:
    webform:
      type: string
      label: 'Webform'
      constraints:
        NotBlank: []
        Regex:
          pattern: '/^[a-z0-9_]+$/'
          message: 'The webform must be a machine name.'
    title:
      type: label
      label: 'Title'
    subtitle:
      type: label
      label: 'Subtitle'
    button_label:
      type: required_label
      label: 'Button label'
    display:
      type: string
      label: 'Where the rest of the form opens'
      constraints:
        Choice:
          - panel
          - inline
