  body:
    -
      value: '<p>Lasting conservation cannot happen without the support and involvement of local communities. Meridian''s community partnership programs are built on the principle that conservation should benefit the people who live closest to the land — not just the land itself.</p><drupal-media data-entity-type="media" data-entity-uuid="f9330fc2-f722-48e8-8e92-b0a5c6f8f239" data-align="left" data-caption="Community conservation planning">&nbsp;</drupal-media><p>We work with rural communities, municipalities, school districts, and local organizations to develop conservation strategies that address shared priorities. That might mean protecting a forested watershed that provides a town''s drinking water, creating public access trails on newly conserved land, or partnering with a school district to build outdoor classrooms on community conservation areas.</p><p>Our partnership model is collaborative, not prescriptive. We listen first, then work together to identify projects that serve both ecological and community needs. We provide technical assistance, funding support, and long-term stewardship — but the direction comes from the community. Over the past decade, these partnerships have resulted in over 50 collaborative conservation projects and lasting relationships built on mutual respect and shared purpose.</p>'
      format: full_html
