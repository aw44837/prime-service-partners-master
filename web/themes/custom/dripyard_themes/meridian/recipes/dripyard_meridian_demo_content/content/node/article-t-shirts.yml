  body:
    -
      value: "<p>Meridian's apparel line reflects our commitment to quality, simplicity, and the landscapes we protect. Our t-shirts are made from 100% organic cotton, printed with water-based inks, and designed with the same understated aesthetic that defines our conservation work.</p><p>Each design draws inspiration from the ecosystems we serve — from Appalachian ridgeline silhouettes to native plant illustrations rendered by regional artists. The colors are drawn from the landscape itself: forest greens, clay browns, slate grays, and the muted golds of autumn meadows.</p><p>We partner with domestic manufacturers who share our values around sustainability and fair labor practices. Every shirt purchased supports our land protection and wildlife conservation programs. Wear your commitment to wild places — not as a statement, but as a quiet reminder of what matters.</p>"
