services:
  psp_seo.canonical_absolute_subscriber:
    class: Drupal\psp_seo\EventSubscriber\CanonicalAbsoluteSubscriber
    arguments: ['@path.matcher']
    tags:
      - { name: event_subscriber }
  psp_seo.html_enhancement_subscriber:
    class: Drupal\psp_seo\EventSubscriber\HtmlEnhancementSubscriber
    arguments: ['@router.admin_context']
    tags:
      - { name: event_subscriber }
