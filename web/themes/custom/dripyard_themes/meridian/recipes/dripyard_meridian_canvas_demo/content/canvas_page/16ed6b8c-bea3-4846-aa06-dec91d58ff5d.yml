      uuid: df5c0d6c-6731-42bd-a935-d388d1b6c13d
      component_id: sdc.dripyard_base.heading
      inputs:
        text: 'Securing Redwoods'
        html_element: h2
        style: h2
        margin_top: zero
        margin_bottom: zero
        center: false
        color: primary
    -
      parent_uuid: 7f8288e1-80a8-4828-8837-5dd6f1e61cc4
      slot: content
      uuid: 96287471-5339-417a-ade0-c82d6ad539e2
      component_id: sdc.dripyard_base.text
      inputs:
        text:
          value: "<p>Coast redwoods are among Earth's oldest and tallest living organisms, with some trees reaching over 350 feet tall and living for more than 2,000 years. Our conservation efforts focus on protecting remaining old-growth forests, restoring logged areas, and creating wildlife corridors that connect fragmented habitats. Through strategic land acquisition and partnerships with local communities, we're working to ensure these magnificent giants continue to thrive for generations to come.</p>"
          format: canvas_html_block
        style: body_m
        color: medium
        center: false
    -
