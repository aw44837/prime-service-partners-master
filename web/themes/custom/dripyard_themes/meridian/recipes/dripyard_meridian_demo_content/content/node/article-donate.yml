  body:
    -
      value: "<p>Your financial support makes Meridian's conservation work possible. Every dollar donated goes directly toward protecting land, restoring habitats, monitoring wildlife, and engaging communities in the work of conservation.</p><p>We are transparent about how donations are used. In our most recent fiscal year, 87% of all funds went directly to conservation programs — land protection, scientific research, wildlife monitoring, habitat restoration, and community partnerships. The remaining 13% supports the organizational infrastructure that keeps our programs effective and accountable.</p><p>There are many ways to give. One-time gifts provide immediate support for active projects. Monthly sustaining gifts provide reliable funding that allows us to plan and execute long-term conservation strategies. Legacy gifts through estate planning ensure that your commitment to conservation endures beyond your lifetime. Corporate matching programs can double the impact of your contribution.</p><p>However you choose to give, know that your support has a direct, measurable impact on the landscapes and communities we serve. Conservation is a long game, and we are grateful for every partner who joins us in playing it.</p>"
