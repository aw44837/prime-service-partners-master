name: meridian_subtheme
type: theme
'base theme': meridian
description: ''
core_version_requirement: ^11

libraries:
  - meridian_subtheme/base
ckeditor5-stylesheets:
  - css/cta-box.css
version: 1.0.0
generator: 'meridian_subtheme:unknown-version'

#
# Libraries extend will add custom libraries to specified libraries
# @see https://www.drupal.org/docs/develop/theming-drupal/adding-assets-css-js-to-a-drupal-theme-via-librariesyml
#

# libraries-extend:

# In this, case we extend dripyard_base's user-login-form library with
# our own of the same name.

#   dripyard_base/user-login-form:
#     - testtheme/user-login-form

# Here we extend dripyard_base's status-message SDC library with our own.

#  core/components.dripyard_base--status-messages:
#    - testtheme/status-messages

regions:
  header_above: Header above
  header_first: Header first (logo)
  header_second: Header second (center)
  header_third: Header third (right)
  highlighted: Highlighted
  content: Content
  fixed_middle_right: Fixed middle right (local actions tabs)
  fixed_bottom_right: Fixed bottom right (messages)
  footer_top: Footer top
  footer_left: Footer left
  footer_right: Footer right
  footer_bottom: Footer bottom

# The NeonByte header collapses to its mobile flyout at 1000px; this estate
# wants it at 1180px (matching Meridian's own breakpoint). Every NeonByte
# breakpoint lives in these six files, so we serve re-gated copies rather
# than fighting them with overrides — see css/neonbyte-1180/README.md.
libraries-override:
  core/components.neonbyte--header:
    css:
      component:
        ../themes/custom/dripyard_themes/neonbyte/components/header/header/header.css: css/neonbyte-1180/header.css
  core/components.neonbyte--primary-menu:
    css:
      component:
        ../themes/custom/dripyard_themes/neonbyte/components/header/primary-menu/primary-menu-wide.css: css/neonbyte-1180/primary-menu-wide.css
        ../themes/custom/dripyard_themes/neonbyte/components/header/primary-menu/primary-menu-narrow.css: css/neonbyte-1180/primary-menu-narrow.css
        ../themes/custom/dripyard_themes/neonbyte/components/header/primary-menu/primary-menu-wide.theme.css: css/neonbyte-1180/primary-menu-wide.theme.css
        ../themes/custom/dripyard_themes/neonbyte/components/header/primary-menu/primary-menu-narrow.theme.css: css/neonbyte-1180/primary-menu-narrow.theme.css
  core/components.neonbyte--mobile-nav-button:
    css:
      component:
        ../themes/custom/dripyard_themes/neonbyte/components/header/mobile-nav-button/mobile-nav-button.css: css/neonbyte-1180/mobile-nav-button.css
