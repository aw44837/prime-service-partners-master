  body:
    -
      value: '<p>Wildlife does not recognize property lines or political boundaries. Effective wildlife protection requires landscape-scale thinking, rigorous science, and sustained commitment. At Meridian, we work to ensure that native species have the habitat, connectivity, and conditions they need to survive and recover.</p><drupal-media data-entity-type="media" data-entity-uuid="035e8272-c61d-483a-8946-3ed006eba043" data-align="left" data-caption="Wildlife monitoring">&nbsp;</drupal-media><p>Our wildlife programs focus on monitoring and protecting species of greatest conservation need — from black bears and brook trout to cerulean warblers and hellbenders. We conduct long-term population surveys, map critical habitats, and collaborate with state and federal agencies on recovery plans.</p><p>Equally important is our work on habitat connectivity. Fragmented landscapes isolate populations and reduce genetic diversity. Through targeted land protection and restoration, we create and maintain wildlife corridors that allow species to move, migrate, and adapt to changing conditions. Every species we help protect strengthens the web of life that sustains us all.</p>'
