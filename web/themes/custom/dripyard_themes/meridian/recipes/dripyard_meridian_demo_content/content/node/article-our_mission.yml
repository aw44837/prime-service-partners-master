  body:
    -
      value: '<p>The Meridian Conservation Society exists to protect and preserve the wild landscapes, waterways, and wildlife that define our natural heritage. Founded on the belief that healthy ecosystems are essential to thriving communities, we work at the intersection of science, policy, and grassroots action.</p><p>Our mission is rooted in a simple truth: the land sustains us, and we must sustain the land. From the high ridges of the Appalachians to the coastal marshes of the Atlantic, we pursue conservation outcomes that are measurable, lasting, and grounded in the needs of both people and nature.</p><p>We approach this work with humility and determination. Every acre protected, every species monitored, every community engaged represents a step toward a future where conservation is not an afterthought but a way of life. Our programs span land protection, scientific research, wildlife conservation, and environmental education — each informed by decades of field experience and a deep commitment to the places we serve.</p>'
