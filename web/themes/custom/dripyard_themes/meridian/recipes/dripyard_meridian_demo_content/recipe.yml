          label: 'Footer Address'
          label_display: 0
          status: true
          info: ''
          view_mode: full
    block.block.meridian_footerlogo:
      placeBlockInDefaultTheme:
        plugin: 'block_content:748f9532-62e9-4656-b187-3c7de76fbf4e'
        region: footer_left
        settings:
          label: 'Footer Logo'
          label_display: 0
          status: true
