  body:
    -
      value: "<p>A Meridian gift card is an invitation to explore — to choose a field guide, a hand-printed map, or a piece of apparel that connects someone you care about to the landscapes and conservation work that define our organization.</p><p>Our gift cards are printed on recycled kraft paper with pressed botanical designs featuring native plants from the regions we serve. Each card comes in a simple envelope with a brief note about Meridian's conservation mission.</p><p>Gift cards are available in denominations of $25, $50, $75, and $100, and can be redeemed for any item in our shop. They never expire. Whether for a birthday, holiday, or simply because someone deserves to be reminded of the wild places that sustain us, a Meridian gift card is a thoughtful way to support conservation while sharing something meaningful.</p>"
