  body:
    -
      value: '<p>Meridian hosts a year-round calendar of events that bring people together around conservation — from guided field walks and bird counts to workshops on forest management and community conservation planning.</p><p>Our seasonal offerings include spring wildflower walks, summer stream monitoring workshops, fall foliage hikes with ecologist-led interpretation, and winter tracking expeditions. Each event is led by experienced naturalists and researchers who share their knowledge of local ecosystems in accessible, engaging ways.</p><p>We also host an annual conservation symposium that brings together landowners, researchers, policymakers, and community members to discuss the most pressing conservation challenges facing our region. Past symposium topics have included forest health, water quality, wildlife corridors, and the future of rural conservation communities. Most events are free and open to the public. Check our calendar for upcoming opportunities to learn, explore, and connect with others who care about wild places.</p>'
