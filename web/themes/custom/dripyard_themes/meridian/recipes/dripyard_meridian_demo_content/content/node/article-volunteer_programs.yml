  body:
    -
      value: '<p>Conservation happens on the ground, and volunteers are essential to making it work. Meridian''s volunteer programs connect people with hands-on conservation opportunities — from trail maintenance and tree planting to wildlife monitoring and stream restoration.</p><drupal-media data-entity-type="media" data-entity-uuid="428b29dc-840e-44fd-bb3a-ff1f5b771724" data-align="left" data-caption="Volunteer restoration work">&nbsp;</drupal-media><p>Our regular volunteer days take place at project sites across the region, typically on weekends from March through November. No special skills are required — just a willingness to work outdoors, get your hands dirty, and contribute to something lasting. We provide tools, training, and experienced crew leaders for every project.</p><p>For those seeking deeper engagement, our seasonal volunteer crews offer multi-day commitments on larger restoration projects. These crews work alongside our professional staff on priority conservation sites, gaining practical field experience while making a measurable difference. Many of our current staff members started as volunteers. Whatever your schedule or experience level, there is a way to contribute. The land needs your help.</p>'
      format: full_html
      summary: ''
