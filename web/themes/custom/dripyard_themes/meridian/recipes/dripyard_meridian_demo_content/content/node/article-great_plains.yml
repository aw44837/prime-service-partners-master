  body:
    -
      value: '<p>The Great Plains are America''s most endangered ecosystem. Less than four percent of the original tallgrass prairie remains, and the mixed-grass and shortgrass prairies that once stretched from Texas to Saskatchewan continue to be converted to cropland at alarming rates. Meridian''s prairie programs work to protect and restore what remains of this vast grassland heritage.</p><drupal-media data-entity-type="media" data-entity-uuid="59823da9-254b-4a50-8455-ab025499e73a" data-align="left" data-caption="Tallgrass prairie landscape">&nbsp;</drupal-media><p>Prairies are not empty landscapes — they are among the most biologically productive ecosystems on earth. Their deep root systems sequester enormous amounts of carbon, their diverse plant communities support pollinators and grassland birds, and their soils filter water and resist drought. When we lose prairie, we lose all of these benefits.</p><p>Our approach combines strategic land protection with active management. We work with ranchers to implement grazing practices that mimic the natural disturbance patterns that prairies evolved with. We restore degraded grasslands with locally sourced native seed mixes. And we advocate for farm bill policies that reward landowners for keeping grasslands intact. The future of the Great Plains depends on finding ways to sustain both agriculture and the prairie ecosystems that make farming possible.</p>'
      format: full_html
      summary: ''
