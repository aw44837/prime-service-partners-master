      component_id: sdc.dripyard_base.text
      inputs:
        text:
          value: "<p>America's deserts support remarkable biodiversity, from iconic saguaro cacti to elusive desert tortoises. Our desert conservation initiatives focus on protecting critical water sources, combating invasive species, and working with local communities to preserve these fragile ecosystems that have evolved over millennia.</p>"
          format: canvas_html_block
        style: body_m
        color: medium
        center: false
