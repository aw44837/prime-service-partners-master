psp_request_service.settings:
  type: config_object
  label: 'Request Service form settings'
  mapping:
    company_name:
      type: string
      label: 'Company name used in SMS consent and the booking email'
    lead_source:
      type: string
      label: 'Lead source value'
    email_subject:
      type: string
      label: 'Booking email subject (empty = "New <company> Booking Request")'
    zips:
      type: sequence
      label: 'Service-area zip codes (empty = accept any 5-digit zip)'
      sequence:
        type: string
        label: 'Zip code'
    address_key_id:
      type: string
      label: 'Key entity holding the Google Places API (New) key for the service-address lookup'
    address_stub:
      type: boolean
      label: 'Address lookup stub mode (canned results, no API calls; testing only)'
    zip_places:
      type: sequence
      label: 'City/state/location of each service-area zip (drush psp-rs-zips)'
      sequence:
        type: mapping
        label: 'Zip place'
        mapping:
          zip:
            type: string
            label: 'Zip'
          city:
            type: string
            label: 'City'
          state:
            type: string
            label: 'State'
          lat:
            type: float
            label: 'Latitude'
          lng:
            type: float
            label: 'Longitude'

block.settings.psp_booking_card:
  type: block_settings
  label: 'Booking card block'
  constraints:
    FullyValidatable: ~
  mapping:
    webform:
      type: string
      label: 'Webform'
      constraints:
        NotBlank: []
        Regex:
          pattern: '/^[a-z0-9_]+$/'
          message: 'The webform must be a machine name.'
    title:
      type: label
      label: 'Title'
    subtitle:
      type: label
      label: 'Subtitle'
    button_label:
      type: required_label
      label: 'Button label'
    display:
      type: string
      label: 'Where the rest of the form opens'
      constraints:
        Choice:
          - panel
          - inline
    theme:
      type: string
      label: 'Background'
      constraints:
        Choice:
          - inherit
          - white
          - light
          - dark
          - black
          - primary
          - secondary
    call_label:
      type: label
      label: 'Call button label'
    phone:
      type: label
      label: 'Phone number (empty = site main number)'
    online_heading:
      type: label
      label: 'Book online heading'
    choice_style:
      type: string
      label: 'Service buttons'
      constraints:
        Choice:
          - icons
          - pills
