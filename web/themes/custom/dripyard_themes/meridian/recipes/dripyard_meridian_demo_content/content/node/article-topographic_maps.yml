  body:
    -
      value: "<p>There is no substitute for a good topographic map. While digital tools have their place, a printed topo map offers something screens cannot — a comprehensive view of the terrain that reveals relationships between ridges, valleys, waterways, and elevation that are essential for understanding a landscape.</p><p>Meridian's map collection features USGS topographic quadrangles and custom trail maps covering the conservation lands and wild spaces where we work. Our custom maps are produced in partnership with regional cartographers and include updated trail information, conservation easement boundaries, and points of ecological interest.</p><p>Whether you are planning a backcountry trip, studying the watershed that feeds your community, or simply appreciating the art of cartography, our maps connect you to the landscape in a tangible way. Proceeds support our trail maintenance and public access programs that keep wild places open and accessible for everyone.</p>"
