psp_service_area.settings:
  type: config_object
  label: 'PSP Service Area settings'
  mapping:
    default_phone_display:
      type: string
      label: 'Default phone (display)'
    default_phone_uri:
      type: string
      label: 'Default phone (tel: URI)'
    default_booking_url:
      type: string
      label: 'Default booking URL'
    default_company_name:
      type: string
      label: 'Default company name'
    default_address:
      type: string
      label: 'Default address'
    default_map_url:
      type: string
      label: 'Default map URL'

block.settings.psp_area_menu:
  type: block_settings
  label: 'Service area menu block'
  mapping:
    fallback_menu:
      type: string
      label: 'Menu used outside any service area'
    expand_all_items:
      type: boolean
      label: 'Expand all items'
    depth:
      type: integer
      label: 'Maximum depth (service area menus)'
    fallback_depth:
      type: integer
      label: 'Maximum depth (fallback menu)'
    region_suggestion:
      type: string
      label: 'Region template suggestion'

block.settings.psp_area_branding:
  type: block_settings
  label: 'Service area branding block'

block.settings.psp_area_call_button:
  type: block_settings
  label: 'Service area call button block'
  mapping:
    style:
      type: string
      label: 'Button style'
    size:
      type: string
      label: 'Button size'
    suffix_icon:
      type: string
      label: 'Suffix icon'

block.settings.psp_area_footer_info:
  type: block_settings
  label: 'Service area footer info block'

psp_service_area.zip_map:
  type: config_object
  label: 'Service area ZIP code map'
  mapping:
    map:
      type: sequence
      label: 'ZIP -> area path prefix'
      sequence:
        type: string
        label: 'Area path prefix'
    cities:
      type: sequence
      label: 'ZIP -> city display name (future per-city display)'
      sequence:
        type: string
        label: 'City name'

block.settings.psp_area_location_bar:
  type: block_settings
  label: 'Service area location bar block'
