  body:
    -
      value: "<p>Our curated book collection reflects the landscapes, species, and conservation philosophy that guide Meridian's work. From field guides to ecological histories, these titles are selected by our staff naturalists and researchers for their depth, accuracy, and ability to deepen your connection with the natural world.</p><p>Browse our selection of regional field guides covering the birds, trees, wildflowers, and fungi of the Appalachians and beyond. Explore titles on forest ecology, watershed science, and wildlife biology that inform our conservation programs. Discover narratives by writers who have spent years observing and documenting the landscapes we work to protect.</p><p>Every purchase directly supports Meridian's conservation programs. Whether you are looking for a comprehensive tree identification guide for your next hike or a thoughtful gift for someone who cares about wild places, our bookshop offers titles that inform, inspire, and sustain the work of conservation.</p>"
