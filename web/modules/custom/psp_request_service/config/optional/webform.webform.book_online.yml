javascript: |
  /**
   * Request Service form: zip code service-area check (error for out-of-area
   * zips, checkmark for valid ones, then scroll to the sections that #states
   * reveals) and live ###-###-#### phone formatting.
   */
  (function (Drupal) {
    'use strict';

    Drupal.behaviors.pspRequestService = {
      attach: function (context) {
        var root = context.querySelectorAll ? context : document;

        root.querySelectorAll('form.psp-request-service-form input[name="zip"]:not([data-psp-zip])').forEach(function (zip) {
          zip.setAttribute('data-psp-zip', '');
          var form = zip.form;
          var wrapper = zip.closest('.form-item') || zip.parentNode;
          var message = zip.getAttribute('data-webform-pattern-error') || 'It appears that you have entered a zip code outside of our service area.';
          var allowed = new RegExp('^(?:' + zip.getAttribute('pattern') + ')$');
          var error = document.createElement('div');
          error.className = 'psp-zip-error';
          error.setAttribute('role', 'alert');
          error.textContent = message;
          error.hidden = true;
          zip.insertAdjacentElement('afterend', error);
          var success = document.createElement('div');
          success.className = 'psp-zip-success';
          success.setAttribute('role', 'status');
          success.textContent = 'We service this zip code!';
          success.hidden = true;
          error.insertAdjacentElement('afterend', success);
          var wasValid = false;

          function update(scroll) {
            var digits = zip.value.replace(/\D/g, '').slice(0, 5);
            if (zip.value !== digits) {
              zip.value = digits;
            }
            var complete = digits.length === 5;
            var valid = complete && allowed.test(digits);
            var invalid = complete && !valid;
            error.hidden = !invalid;
            success.hidden = !valid;
            wrapper.classList.toggle('psp-zip-valid', valid);
            zip.classList.toggle('error', invalid);
            zip.setAttribute('aria-invalid', invalid ? 'true' : 'false');
            zip.setCustomValidity(invalid ? message : '');

            if (valid !== wasValid) {
              // Re-evaluate #states now; they otherwise wait for keyup/change,
              // which paste and autofill don't fire.
              zip.dispatchEvent(new Event('change', { bubbles: true }));
            }
            if (valid && !wasValid && scroll) {
              // Give #states a beat to reveal the next section, then move to it.
              setTimeout(function () {
                var next = form.querySelector('.psp-zip-reveal .form-element');
                var section = next && next.closest('.psp-zip-reveal');
                if (section) {
                  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                  next.focus({ preventScroll: true });
                }
              }, 700);
            }
            wasValid = valid;
          }

          zip.addEventListener('input', function () { update(true); });
          // Restore state after a failed server-side submit or browser autofill.
          update(false);
        });

        root.querySelectorAll('form.psp-request-service-form input[name="page_url"]:not([data-psp-page-url])').forEach(function (input) {
          input.setAttribute('data-psp-page-url', '');
          var url = window.location.href;
          if (window.top !== window.self) {
            try {
              url = window.top.location.href;
            }
            catch (e) {
              url = document.referrer || url;
            }
          }
          input.value = url;
        });
        root.querySelectorAll('form.psp-request-service-form input[name="phone_number"]:not([data-psp-phone])').forEach(function (phone) {
          phone.setAttribute('data-psp-phone', '');
          phone.addEventListener('input', function () {
            var d = phone.value.replace(/\D/g, '');
            // Drop a leading US country code; no area code starts with 1.
            if (d.charAt(0) === '1') {
              d = d.slice(1);
            }
            d = d.slice(0, 10);
            var formatted = d.length > 6 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6)
              : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3)
              : d;
            if (phone.value !== formatted) {
              phone.value = formatted;
            }
          });
        });
      }
    };
  })(Drupal);
